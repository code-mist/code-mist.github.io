name: Build and Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1        # = 你本地 hugo version ✅
      DART_SASS_VERSION: 1.108.2   # = 你本地 sass --version ✅
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0           # Stack 用 GitInfo 算 lastmod

      - name: Setup Hugo (with Dart Sass)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          dart-sass-version: ${{ env.DART_SASS_VERSION }}
          # ⚠️ 不要写 extended: true —— 0.170 已合并单二进制 

      - name: Verify toolchain     # 把编译链路打进日志，出事一眼定位
        run: |
          hugo version             # 应无 +extended，正常输出即可
          hugo env                 # 必须能看到 github.com/sass/dart-sass/compiler

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify    # baseURL 用 hugo.yaml 里写死的 https，别再传 --baseURL

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4   # v3 已弃用 → v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4