name: Build and Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
      DART_SASS_VERSION: 1.108.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7            # v4 → v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (with Dart Sass)
        uses: peaceiris/actions-hugo@v3      # 没被点名，保持不动
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          dart-sass-version: ${{ env.DART_SASS_VERSION }}

      - name: Verify toolchain
        run: |
          hugo version
          hugo env

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6     # v5 → v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --logLevel error

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5   # v4 → v5
        with:
          path: ./public
          include-hidden-files: true        # ⚠️ v4+ 默认丢点文件，博客若有 .well-known 等要加

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5       # v4 → v5